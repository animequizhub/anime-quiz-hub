<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>One Piece Quiz - Anime Quiz Hub</title>

    <link rel="stylesheet" href="onepiece.css">
</head>

<body>

    <main class="quiz-container">

        <header class="quiz-header">
            <a href="quiz.html" class="back-link">← Quiz List</a>

            <h1>🏴 One Piece Quiz</h1>

            <div class="quiz-information">
                <span id="questionCounter">Question 1/20</span>
                <span id="timer">Time: 30</span>
            </div>

            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </header>

        <section class="quiz-card">

            <h2 id="question">Loading question...</h2>

            <div id="answers" class="answers">
                <button class="answer-btn" type="button"></button>
                <button class="answer-btn" type="button"></button>
                <button class="answer-btn" type="button"></button>
                <button class="answer-btn" type="button"></button>
            </div>

            <p id="feedback" class="feedback"></p>

            <button id="nextBtn" class="next-btn" type="button" disabled>
                Next Question
            </button>

        </section>

    </main>

    <script type="module" src="onepiece.js"></script>

</body>
</html>
