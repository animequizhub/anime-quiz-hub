<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Result - Anime Quiz Hub</title>

    <link rel="stylesheet" href="result.css">
</head>

<body>

    <main class="result-card">

        <h1>🏆 Quiz Complete!</h1>

        <p id="quizName">One Piece Quiz</p>

        <h2 id="score">Score: 0/20</h2>
        <h2 id="percentage">Percentage: 0%</h2>
        <h2 id="rank">Rank: F</h2>
        <h2 id="xp">XP Earned: 0</h2>

        <p id="message">
            Saving your result...
        </p>

        <div class="buttons">
            <button id="retryBtn" type="button">
                Try Again
            </button>

            <button id="dashboardBtn" type="button">
                Dashboard
            </button>
        </div>

    </main>

    <script type="module" src="result.js?v=30"></script>

</body>
</html>
